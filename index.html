<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>McWoogle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Public+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #fdfcf8;
        --bg-soft: #f4f1e6;
        --surface: #ffffff;
        --ink: #1c1a15;
        --ink-soft: #4c463a;
        --ink-faint: #756d5c;
        --line: #ddd6c4;
        --line-strong: #c9c0a6;
        --blue: #2456a6;
        --blue-dark: #173d78;
        --link: #1a4f9c;
        --url: #2e6b34;
        --red: #b3372a;
        --gold: #a86e00;
        --green: #22603a;
        --tartan-red: #a03123;
        --tartan-green: #1e5631;
        --tartan-navy: #1f3050;
        --shadow: 0 1px 2px rgba(28,26,21,.08), 0 10px 34px rgba(28,26,21,.10);
        --shadow-sm: 0 1px 2px rgba(28,26,21,.10), 0 3px 10px rgba(28,26,21,.07);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14120e;
          --bg-soft: #1d1a14;
          --surface: #201d16;
          --ink: #f2ecdd;
          --ink-soft: #cfc7b2;
          --ink-faint: #a29a83;
          --line: #3a352a;
          --line-strong: #544d3b;
          --blue: #7ea6e8;
          --blue-dark: #a9c4f2;
          --link: #93b8f5;
          --url: #8fce97;
          --red: #e88a7c;
          --gold: #e3b356;
          --green: #8fce97;
          --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 34px rgba(0,0,0,.45);
          --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.35);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Public Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 18px;
        line-height: 1.5;
      }
      button { font: inherit; cursor: pointer; }
      input { font: inherit; }
      a { color: var(--link); }
      :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

      /* ---------- tartan ---------- */
      .tartan {
        height: 14px;
        background:
          repeating-linear-gradient(90deg, rgba(232,198,75,.85) 0 3px, transparent 3px 46px),
          repeating-linear-gradient(90deg, var(--tartan-red) 0 22px, var(--tartan-navy) 22px 30px, var(--tartan-green) 30px 52px, var(--tartan-navy) 52px 58px);
        background-color: var(--tartan-green);
      }
      .tartan-thin {
        height: 8px;
        background:
          repeating-linear-gradient(90deg, rgba(232,198,75,.85) 0 2px, transparent 2px 34px),
          repeating-linear-gradient(90deg, var(--tartan-red) 0 16px, var(--tartan-navy) 16px 22px, var(--tartan-green) 22px 38px, var(--tartan-navy) 38px 43px);
        background-color: var(--tartan-green);
      }

      /* ---------- wordmark ---------- */
      .wordmark {
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-weight: 900;
        letter-spacing: -0.015em;
        line-height: 1;
        white-space: nowrap;
        user-select: none;
      }
      .wordmark .c1 { color: #2456a6; }
      .wordmark .c2 { color: #b3372a; }
      .wordmark .c3 { color: #a86e00; }
      .wordmark .c4 { color: #2456a6; }
      .wordmark .c5 { color: #22603a; }
      .wordmark .c6 { color: #b3372a; }
      .wordmark .c7 { color: #a86e00; }
      .wordmark .c8 { color: #2456a6; }
      @media (prefers-color-scheme: dark) {
        .wordmark .c1, .wordmark .c4, .wordmark .c8 { color: #8fb2ef; }
        .wordmark .c2, .wordmark .c6 { color: #ef9a8c; }
        .wordmark .c3, .wordmark .c7 { color: #eec26a; }
        .wordmark .c5 { color: #93d3a3; }
      }

      /* ---------- home view ---------- */
      #view-home { min-height: 100svh; display: flex; flex-direction: column; }
      .home-top {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding: 16px 22px; flex-wrap: wrap;
      }
      .home-top nav { display: flex; gap: 6px; flex-wrap: wrap; }
      .top-link {
        background: none; border: none; color: var(--ink-soft);
        font-size: 17px; font-weight: 600; padding: 10px 12px; border-radius: 10px;
      }
      .top-link:hover { background: var(--bg-soft); color: var(--ink); }
      .home-main {
        flex: 1; display: flex; flex-direction: column; align-items: center;
        justify-content: center; padding: 24px 20px 40px; text-align: center;
      }
      .crest-home { width: 118px; height: 118px; object-fit: contain; margin-bottom: 6px; }
      .logo-big { font-size: clamp(56px, 13vw, 104px); }
      .tagline { font-size: clamp(19px, 3.4vw, 24px); color: var(--ink-soft); margin: 14px 0 30px; max-width: 34em; }
      .tagline strong { color: var(--ink); }

      .search-wrap { width: 100%; max-width: 680px; position: relative; }
      .search-form { display: flex; gap: 10px; align-items: stretch; }
      .search-box {
        flex: 1; display: flex; align-items: center; gap: 10px;
        background: var(--surface); border: 2px solid var(--line-strong);
        border-radius: 999px; padding: 6px 8px 6px 20px; box-shadow: var(--shadow-sm);
        min-width: 0;
      }
      .search-box:focus-within { border-color: var(--blue); box-shadow: var(--shadow); }
      .search-box svg { flex: none; color: var(--ink-faint); }
      .search-box input {
        flex: 1; border: none; background: none; color: var(--ink);
        font-size: 20px; padding: 10px 0; min-width: 0;
      }
      .search-box input:focus { outline: none; }
      .search-box input::placeholder { color: var(--ink-faint); }
      .clear-btn {
        display: none; flex: none; border: none; background: var(--bg-soft); color: var(--ink-soft);
        width: 40px; height: 40px; border-radius: 999px; font-size: 20px; line-height: 1;
      }
      .clear-btn.show { display: block; }
      .go-btn {
        flex: none; border: none; border-radius: 999px; padding: 0 28px;
        background: var(--blue); color: #fff; font-weight: 800; font-size: 19px;
        box-shadow: var(--shadow-sm); min-height: 56px;
      }
      .go-btn:hover { background: var(--blue-dark); }
      @media (prefers-color-scheme: dark) { .go-btn { color: #10131c; } .go-btn:hover { color: #10131c; } }

      .suggest {
        position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 40;
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); text-align: left; overflow: hidden; display: none;
      }
      .suggest.open { display: block; }
      .suggest button {
        display: flex; width: 100%; align-items: center; gap: 12px;
        background: none; border: none; padding: 14px 18px; font-size: 18px; color: var(--ink);
        text-align: left; border-bottom: 1px solid var(--line);
      }
      .suggest button:last-child { border-bottom: none; }
      .suggest button:hover, .suggest button.active { background: var(--bg-soft); }
      .suggest .s-ico { color: var(--ink-faint); flex: none; display: inline-flex; }
      .suggest .s-jason { margin-left: auto; flex: none; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }

      .home-actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; justify-content: center; }
      .btn-soft {
        border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink);
        border-radius: 999px; padding: 13px 24px; font-weight: 700; font-size: 17px;
      }
      .btn-soft:hover { border-color: var(--ink-faint); background: var(--bg-soft); }
      .btn-lucky { border-color: var(--gold); color: var(--gold); }
      .btn-lucky:hover { background: var(--bg-soft); border-color: var(--gold); }

      .try-block { margin-top: 38px; max-width: 760px; }
      .try-label { font-size: 14px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 12px; }
      .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .chip {
        border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
        border-radius: 999px; padding: 10px 18px; font-size: 16.5px; font-weight: 600;
      }
      .chip:hover { background: var(--bg-soft); border-color: var(--blue); color: var(--blue-dark); }

      .recent-block { margin-top: 34px; max-width: 760px; display: none; }
      .recent-block.show { display: block; }
      .recent-block .chip { color: var(--ink-soft); }

      .home-foot {
        padding: 20px 22px 26px; text-align: center; color: var(--ink-faint); font-size: 15.5px;
      }
      .home-foot .oath { color: var(--ink-soft); font-weight: 600; }

      /* ---------- results view ---------- */
      #view-results { display: none; min-height: 100svh; flex-direction: column; }
      #view-results.on { display: flex; }
      .r-head {
        position: sticky; top: 0; z-index: 30; background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .r-head-row {
        display: flex; align-items: center; gap: 18px; padding: 14px 22px 10px;
        max-width: 1240px; margin: 0 auto; width: 100%;
      }
      .logo-small { font-size: 32px; background: none; border: none; padding: 4px 2px; }
      .r-head .search-wrap { max-width: 640px; }
      .r-head .go-btn { min-height: 50px; padding: 0 20px; font-size: 17px; }
      .r-head .search-box input { font-size: 18px; padding: 7px 0; }
      .tabs {
        display: flex; gap: 4px; max-width: 1240px; margin: 0 auto; width: 100%;
        padding: 2px 22px 0; flex-wrap: wrap;
      }
      .tab {
        background: none; border: none; border-bottom: 3px solid transparent;
        color: var(--ink-soft); font-weight: 700; font-size: 16.5px; padding: 10px 14px 8px;
      }
      .tab:hover { color: var(--ink); }
      .tab[aria-selected="true"] { color: var(--blue-dark); border-bottom-color: var(--blue); }

      .r-body { flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding: 18px 22px 10px; }
      .stats { color: var(--ink-faint); font-size: 15.5px; margin: 2px 0 16px; }
      .stats strong { color: var(--ink-soft); }
      .dym { font-size: 17.5px; margin: 0 0 18px; color: var(--ink-soft); }
      .dym button { background: none; border: none; padding: 0; color: var(--red); font-weight: 700; font-style: italic; }
      .dym button:hover { text-decoration: underline; }

      .r-grid { display: grid; grid-template-columns: minmax(0, 1fr) 348px; gap: 34px; align-items: start; }
      @media (max-width: 920px) { .r-grid { grid-template-columns: minmax(0, 1fr); } }

      .featured {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 20px 22px; box-shadow: var(--shadow-sm); margin-bottom: 26px;
      }
      .featured .f-kicker {
        display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 800;
        letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px;
      }
      .featured h2 { font-family: "Fraunces", Georgia, serif; font-size: 26px; margin: 0 0 8px; line-height: 1.2; }
      .featured p { margin: 0 0 10px; font-size: 18.5px; color: var(--ink); }
      .featured .f-src { font-size: 15px; color: var(--ink-faint); margin: 0; }
      .featured mark { background: rgba(232,198,75,.45); color: inherit; padding: 0 2px; border-radius: 3px; }
      @media (prefers-color-scheme: dark) { .featured mark { background: rgba(232,198,75,.28); } }

      .result { margin-bottom: 30px; }
      .r-site { display: flex; align-items: center; gap: 10px; margin-bottom: 3px; }
      .r-fav {
        width: 30px; height: 30px; border-radius: 999px; flex: none;
        display: inline-flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 15px; color: #fff; background: var(--tartan-green);
      }
      .r-name { font-size: 15.5px; font-weight: 600; color: var(--ink); line-height: 1.25; }
      .r-url { font-size: 14px; color: var(--ink-faint); line-height: 1.25; word-break: break-all; }
      .r-title {
        display: inline-block; font-size: 21.5px; font-weight: 600; color: var(--link);
        text-decoration: none; line-height: 1.3; margin: 1px 0 3px;
      }
      .r-title:hover { text-decoration: underline; }
      .r-snip { margin: 0; color: var(--ink-soft); font-size: 17px; max-width: 42em; }
      .r-snip .r-date { color: var(--ink-faint); }
      .r-tag {
        display: inline-block; font-size: 12.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
        border: 1px solid var(--line-strong); color: var(--ink-soft); border-radius: 999px; padding: 2px 9px; margin-top: 7px;
      }
      .r-tag.fam { border-color: var(--green); color: var(--green); }
      .r-tag.scot { border-color: var(--gold); color: var(--gold); }
      .r-tag.riva { border-color: var(--blue); color: var(--blue-dark); }
      .r-tag.phil { border-color: #b3372a; color: #b3372a; background: rgba(232,198,75,.14); }
      .r-byline { display:block; margin-top:5px; font-size:14.5px; color: var(--ink-faint); font-style: normal; }
      .r-byline strong { color: var(--ink-soft); font-weight:700; }
      .panel .p-empty { color: var(--ink-faint); font-size:15.5px; text-align:center; padding:8px 0 2px; }
      .trend-note { display:none; }

      .paa { border-top: 1px solid var(--line); margin: 6px 0 30px; }
      .paa h3 { font-family: "Fraunces", Georgia, serif; font-size: 23px; margin: 18px 0 6px; }
      .paa-item { border-bottom: 1px solid var(--line); }
      .paa-q {
        width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 14px;
        background: none; border: none; text-align: left; padding: 15px 2px;
        font-size: 18px; font-weight: 600; color: var(--ink);
      }
      .paa-q .chev { color: var(--ink-faint); transition: transform .18s ease; flex: none; display: inline-flex; }
      .paa-item.open .paa-q .chev { transform: rotate(180deg); }
      .paa-a { display: none; padding: 0 2px 17px; color: var(--ink-soft); font-size: 17px; max-width: 42em; }
      .paa-item.open .paa-a { display: block; }

      .related h3 { font-family: "Fraunces", Georgia, serif; font-size: 23px; margin: 4px 0 14px; }
      .related .chips { justify-content: flex-start; }

      .pager { text-align: center; padding: 26px 0 8px; }
      .pager-word { font-family: "Fraunces", Georgia, serif; font-weight: 900; font-size: 30px; letter-spacing: .01em; }
      .pager-nums { display: flex; justify-content: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
      .pager-nums button {
        background: none; border: none; min-width: 42px; height: 42px; border-radius: 10px;
        font-size: 17px; font-weight: 700; color: var(--link);
      }
      .pager-nums button:hover { background: var(--bg-soft); }
      .pager-nums button[aria-current="page"] { color: var(--ink); text-decoration: underline; }

      /* ---------- knowledge panel ---------- */
      .panel {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow-sm); overflow: hidden;
      }
      .panel .tartan-thin { margin: 0; }
      .panel-body { padding: 20px 22px 22px; }
      .panel img.crest { width: 148px; height: 148px; object-fit: contain; display: block; margin: 2px auto 10px; }
      .panel h2 { font-family: "Fraunces", Georgia, serif; font-size: 30px; margin: 0; text-align: center; }
      .panel .p-sub { text-align: center; color: var(--ink-soft); font-size: 16px; margin: 4px 0 16px; }
      .panel dl { margin: 0; }
      .panel .fact { display: grid; grid-template-columns: 104px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
      .panel dt { font-weight: 800; font-size: 14.5px; color: var(--ink-soft); padding-top: 2px; }
      .panel dd { margin: 0; font-size: 16.5px; }
      .panel .p-claim {
        margin-top: 16px; background: var(--bg-soft); border-radius: 10px; padding: 12px 14px;
        font-size: 15.5px; color: var(--ink-soft);
      }
      .panel .p-claim strong { color: var(--ink); }

      .r-foot { border-top: 1px solid var(--line); margin-top: 26px; }
      .r-foot-in {
        max-width: 1240px; margin: 0 auto; padding: 18px 22px 30px; color: var(--ink-faint); font-size: 15px;
        display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap;
      }
      .r-foot button { background: none; border: none; color: var(--ink-soft); font-weight: 700; padding: 6px 4px; }

      /* ---------- Jason Prize ---------- */
      .r-chrome { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
      .r-chrome .stats { margin-bottom: 16px; }
      .prize-link {
        background: none; border: none; padding: 4px 2px; flex: none;
        color: var(--ink-faint); font-size: 14.5px; font-weight: 600; text-decoration: underline;
        text-underline-offset: 3px;
      }
      .prize-link:hover { color: var(--ink); }
      .prize-panel {
        background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius);
        box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 26px; text-align: center;
      }
      .prize-inner { padding: 26px 24px 28px; position: relative; }
      .prize-kicker {
        font-size: 13.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
        color: var(--gold); margin: 0 0 6px;
      }
      .prize-panel h2 { font-family: "Fraunces", Georgia, serif; font-size: 34px; margin: 0 0 8px; line-height: 1.15; }
      .prize-congrats { margin: 0 auto 4px; font-size: 18.5px; color: var(--ink); max-width: 34em; }
      .prize-awarded { margin: 0 auto 18px; font-size: 17px; color: var(--ink-soft); max-width: 34em; }
      .prize-awarded strong { color: var(--ink); }
      .prize-badge { display: flex; justify-content: center; margin: 0 0 20px; }
      .prize-badge svg { width: 196px; height: 196px; display: block; }
      .prize-actions { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
      .prize-btn {
        border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: 16.5px;
        border: 2px solid var(--blue); background: var(--blue); color: #fff; box-shadow: var(--shadow-sm);
      }
      .prize-btn:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
      @media (prefers-color-scheme: dark) { .prize-btn { color: #10131c; } .prize-btn:hover { color: #10131c; } }
      .prize-btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); box-shadow: none; }
      .prize-btn.secondary:hover { background: var(--bg-soft); border-color: var(--ink-faint); }
      .prize-guestbook { font-size: 16.5px; font-weight: 600; padding: 10px 4px; }
      .prize-status { margin: 12px 0 0; font-size: 15px; color: var(--green); min-height: 1.4em; }
      .prize-hide {
        display: block; margin: -10px -6px 2px auto; background: none; border: none;
        color: var(--ink-faint); font-size: 14.5px; font-weight: 600; padding: 6px 8px;
      }
      .prize-hide:hover { color: var(--ink); text-decoration: underline; }
      @media (max-width: 640px) {
        .prize-inner { padding: 22px 16px 24px; }
        .prize-badge svg { width: 168px; height: 168px; }
        .prize-actions { flex-direction: column; align-items: stretch; }
        .prize-guestbook { text-align: center; }
      }

      .fade-in { animation: fadeUp .28s ease both; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .fade-in { animation: none; }
        .paa-q .chev { transition: none; }
      }

      @media (max-width: 640px) {
        body { font-size: 17.5px; }
        .search-form { flex-direction: column; }
        .go-btn { width: 100%; min-height: 54px; }
        .r-head-row { flex-wrap: wrap; gap: 8px; }
        .r-head .search-wrap { flex: 1 1 100%; order: 3; }
        .crest-home { width: 92px; height: 92px; }
        .panel .fact { grid-template-columns: 92px 1fr; }
      }
    </style>
  </head>
  <body>
    <!-- ================= HOME ================= -->
    <div id="view-home">
      <div class="tartan" aria-hidden="true"></div>
      <header class="home-top">
        <nav aria-label="McWoogle">
          <button class="top-link" type="button" data-q="About McWoogle">About</button>
          <button class="top-link" type="button" data-q="How does McWoogle work?">How Search works</button>
          <button class="top-link" type="button" data-q="Local news Lafayette Louisiana">News</button>
        </nav>
        <nav aria-label="More">
          <button class="top-link" type="button" data-q="McWoogle Mail">McMail</button>
          <button class="top-link" type="button" data-q="Photos of Lafayette Louisiana">Images</button>
          <button class="top-link" type="button" data-q="Maps of Wimberley Texas">Maps</button>
        </nav>

    <script>
      "use strict";

      /* ---------------- helpers ---------------- */
      function $(id) { return document.getElementById(id); }
      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function cleanQuery(q) {
        return String(q || "").replace(/\s+/g, " ").trim().replace(/[.?!]+$/, "");
      }
      function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
      function hashStr(s) {
        var h = 2166136261;
        for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
        return h >>> 0;
      }
      function rng(seed) {
        var a = seed >>> 0;
        return function () {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function pick(rand, arr) { return arr[Math.floor(rand() * arr.length)]; }
      function pickN(rand, arr, n) {
        var copy = arr.slice(), out = [];
        while (copy.length && out.length < n) out.push(copy.splice(Math.floor(rand() * copy.length), 1)[0]);
        return out;
      }

      input.value = q;
      if (form.requestSubmit) { form.requestSubmit(); }
      else { form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true })); }
    } catch (e) { /* a plain visit is fine too */ }
  }
  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", run); }
  else { run(); }
})();
</script>
</body>
</html>
